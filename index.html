<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Practice</title>
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--text:#1d2030;--muted:#6b7089;--line:#e3e6f0;
  --accent:#4f46e5;--accent-soft:#eceafd;
  --ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;
  --easy:#15803d;--medium:#b45309;--hard:#b91c1c;
  --warn-bg:#fff4d6;--warn-text:#7a4b00;--warn-line:#f0d58a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141f;--card:#1c1f2e;--text:#eceefa;--muted:#9aa0bd;--line:#2d3150;
  --accent:#8b86ff;--accent-soft:#2a2850;--ok:#4ade80;--ok-bg:#12301f;--bad:#f87171;--bad-bg:#3a1618;
  --easy:#4ade80;--medium:#fbbf24;--hard:#f87171;
  --warn-bg:#3a2e12;--warn-text:#fbd98a;--warn-line:#5c4a1c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.credit{background:#1e2340;color:#e6e8f5;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:11px 16px;font-size:.9rem;letter-spacing:.4px;border-bottom:3px solid var(--accent)}
.credit b{color:#fff;font-weight:700}
.credit i{width:1px;height:14px;background:#6b7089;display:inline-block}
@media (max-width:520px){.credit i{display:none}}
.notice{background:var(--warn-bg);color:var(--warn-text);border-bottom:1px solid var(--warn-line);padding:9px 16px;text-align:center;font-size:.88rem;line-height:1.45}
.notice b{font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.8rem;margin:10px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.subject{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.subject:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(79,70,229,.15)}
.subject .num{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:2px 10px;font-size:.8rem}
.subject h3{margin:12px 0 4px;font-size:1.1rem}
.subject p{margin:0;color:var(--muted);font-size:.9rem}
.subject.empty{opacity:.75}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.stat b{font-size:1.2rem}
.stat span{color:var(--muted);font-size:.85rem;display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.btn,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border-radius:10px}
.btn:hover,.chip:hover{border-color:var(--accent)}
select{border-radius:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:.78rem}
.tag{border-radius:99px;padding:2px 10px;font-weight:700;border:1px solid currentColor}
.tag.easy{color:var(--easy)}.tag.medium{color:var(--medium)}.tag.hard{color:var(--hard)}
.tag.topic{color:var(--muted);font-weight:600}
.qtext{font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-weight:700;color:var(--accent);min-width:18px}
.q.done .opt{cursor:default}
.q.done .opt:hover{border-color:var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.note{margin-top:8px;font-size:.88rem;font-weight:600}
.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.why{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.9rem}
.dlrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 4px}
.dlbtn{display:inline-block;font:inherit;font-weight:600;text-decoration:none;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:8px 16px;cursor:pointer}
.dlbtn:hover{filter:brightness(1.08)}
.dlbtn.off{background:var(--card);color:var(--muted);border-color:var(--line)}
.dlbtn.off:hover{filter:none;border-color:var(--accent)}
.dlmsg{color:var(--muted);font-size:.88rem}
.emptybox{text-align:center;padding:50px 20px;color:var(--muted)}
.result{text-align:center;font-size:1.1rem}
.hidden{display:none}

:root[data-theme="light"]{--bg:#f5f6fb;--card:#fff;--text:#1d2030;--muted:#6b7089;--line:#e3e6f0;--accent:#4f46e5;--accent-soft:#eceafd;--ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;--easy:#15803d;--medium:#b45309;--hard:#b91c1c;--warn-bg:#fff4d6;--warn-text:#7a4b00;--warn-line:#f0d58a}
:root[data-theme="dark"]{--bg:#000;--card:#0d0d12;--text:#eceefa;--muted:#9aa0bd;--line:#26283a;--accent:#8b86ff;--accent-soft:#1c1a3d;--ok:#4ade80;--ok-bg:#0c2416;--bad:#f87171;--bad-bg:#2a1012;--easy:#4ade80;--medium:#fbbf24;--hard:#f87171;--warn-bg:#2a2009;--warn-text:#fbd98a;--warn-line:#4a3a14}
.theme-btn{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:9px 16px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* ===== BOOK LOADER ===== */
.bkload{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(7px)}
.bkload.on{display:flex;animation:bkfade .25s}
@keyframes bkfade{from{opacity:0}to{opacity:1}}
.bk{position:relative;width:180px;height:124px;perspective:900px;transform:rotateX(14deg)}
.bk .cover{position:absolute;inset:-9px;border-radius:8px 14px 14px 8px;background:linear-gradient(125deg,#4f46e5,#7c3aed 60%,#ec4899);box-shadow:0 18px 34px rgba(0,0,0,.35)}
.bk .cover::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:rgba(0,0,0,.28)}
.bk .base{position:absolute;top:0;width:50%;height:100%;background-color:#fbf8ee;background-image:repeating-linear-gradient(transparent 0 13px,rgba(79,70,229,.18) 13px 14px);box-shadow:inset 0 0 14px rgba(0,0,0,.10)}
.bk .bl{left:0;border-radius:4px 0 0 4px}
.bk .br{right:0;border-radius:0 4px 4px 0}
.bk .pg{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;animation:bkflip .6s ease-in-out infinite;animation-delay:calc(var(--i) * -.1s)}
.bk .pg i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:#fffdf6;background-image:repeating-linear-gradient(transparent 0 13px,rgba(79,70,229,.16) 13px 14px);border-radius:0 4px 4px 0;box-shadow:0 0 8px rgba(0,0,0,.18)}
.bk .pg i+i{transform:rotateY(180deg);border-radius:4px 0 0 4px;background-color:#f3efe1}
@keyframes bkflip{0%{transform:rotateY(0deg)}100%{transform:rotateY(-180deg)}}
.bktxt{font-weight:700;font-size:1.05rem;color:var(--text);text-align:center;padding:0 20px;max-width:90vw}
.bktxt span{color:var(--accent)}
.bktxt::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:bkdots 1s steps(4) infinite;overflow:hidden;vertical-align:bottom}
@keyframes bkdots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ===== PORTFOLIO THEME (black + red) ===== */
:root,:root[data-theme="dark"]{--bg:#050505;--card:#0d0d0d;--text:#f4f4f4;--muted:#9a9a9a;--line:#272727;--accent:#ff3b30;--accent-soft:#2a0d0b;--ok:#34d399;--ok-bg:#062a1d;--bad:#ff6b6b;--bad-bg:#2b0e0e;--easy:#34d399;--medium:#fbbf24;--hard:#ff6b6b;--warn-bg:#1a0f0e;--warn-text:#ffb4ad;--warn-line:#3b1714;--gridc:rgba(255,255,255,.035);--cy:#22d3ee}
:root[data-theme="light"]{--bg:#efede9;--card:#ffffff;--text:#0b0b0b;--muted:#6b6b6b;--line:#d9d6d0;--accent:#e5281d;--accent-soft:#fde8e6;--ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;--easy:#15803d;--medium:#b45309;--hard:#b91c1c;--warn-bg:#fff0ee;--warn-text:#7a1f18;--warn-line:#f5c2bd;--gridc:rgba(0,0,0,.045);--cy:#0891b2}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg);background-image:radial-gradient(700px 360px at 8% -6%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:auto,48px 48px,48px 48px;background-attachment:fixed}
.wrap{max-width:980px}
.credit{background:#000;border-bottom:2px solid var(--accent);font-family:"JetBrains Mono",monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:1.4px;color:#cfcfcf}
.credit b{color:var(--accent)}
.notice{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.4px}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:2.6rem;letter-spacing:1.5px;text-transform:uppercase;margin:10px 0 2px;line-height:1}
.sub{font-family:"JetBrains Mono",monospace;font-size:.78rem}
.hero2{position:relative;padding:8px 0 10px;margin-bottom:18px}
.hero2 .outline{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(4.4rem,19vw,10.5rem);line-height:.84;letter-spacing:2px;color:transparent;-webkit-text-stroke:2px var(--accent);opacity:.95;user-select:none;white-space:nowrap;overflow:hidden}
.hero2 .hello{font-family:Caveat,"Brush Script MT",cursive;font-size:2rem;font-weight:700;margin:-.55em 0 0 4px;position:relative;transform:rotate(-3deg);transform-origin:left}
.hero2 .nameblk{display:inline-block;background:var(--accent);color:#fff;font-size:clamp(2.6rem,10vw,4.8rem);padding:2px 16px 0;margin:2px 0 14px;letter-spacing:2px;line-height:1.02}
.hero2 .pill{display:flex;width:max-content;max-width:100%;align-items:center;gap:9px;font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:1.2px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);padding:7px 14px;border-radius:4px}
.hero2 .pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hero2 .lead{max-width:560px;margin:16px 0 18px;color:var(--text);font-size:1.02rem}
.hero2 .lead b{color:var(--accent)}
.hstats{display:flex;gap:30px;flex-wrap:wrap}
.hstats b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:2.1rem;color:var(--accent);line-height:1}
.hstats span{font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.seclbl{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:1px;color:var(--accent);margin:26px 0 6px;text-transform:uppercase}
.sech{font-size:1.7rem;font-weight:800;margin:0 0 16px;letter-spacing:-.4px}
.grid{gap:22px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.subject{position:relative;border-radius:6px;padding:22px 20px 18px;background:var(--card)}
.subject:hover{transform:none;box-shadow:none;border-color:var(--line)}
.subject .num{background:none;border-radius:0;padding:0;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:2.4rem;line-height:1;color:var(--accent)}
.subject h3{font-size:1.12rem;font-weight:800;margin:8px 0 8px;letter-spacing:-.2px}
.subject p{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:1px;text-transform:uppercase}
.subject::before{content:attr(data-label);position:absolute;left:-6px;top:-21px;background:var(--cy);color:#00161a;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.6rem;letter-spacing:.8px;padding:2px 7px;opacity:0;transition:opacity .15s;pointer-events:none}
.subject::after{content:"";position:absolute;inset:-6px;border:1px solid var(--cy);pointer-events:none;opacity:0;transition:opacity .15s;background:linear-gradient(var(--cy),var(--cy)) 0 0/8px 8px no-repeat,linear-gradient(var(--cy),var(--cy)) 100% 0/8px 8px no-repeat,linear-gradient(var(--cy),var(--cy)) 0 100%/8px 8px no-repeat,linear-gradient(var(--cy),var(--cy)) 100% 100%/8px 8px no-repeat}
.subject:hover::before,.subject:hover::after,.subject:focus-visible::before,.subject:focus-visible::after{opacity:1}
.back{font-family:"JetBrains Mono",monospace;font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
.panel,.q{border-radius:6px}
.q{border-left:3px solid var(--accent)}
.qtext{font-weight:700}
.chip,.btn,select{border-radius:4px;font-family:"JetBrains Mono",monospace;font-size:.74rem;text-transform:uppercase;letter-spacing:.6px}
.chip.on{color:#fff}
.opt{border-radius:4px}
.opt .l{font-family:"JetBrains Mono",monospace}
.tag{border-radius:3px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.6px;font-size:.66rem}
.dlbtn{border-radius:4px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;font-size:.78rem}
.bar{border-radius:0;height:5px}.bar i{background:var(--accent)}
.theme-btn{border-radius:4px;font-family:"JetBrains Mono",monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;background:#000;color:#fff;border-color:var(--accent)}
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;background:rgba(10,10,10,.92);color:#ddd;border:1px solid #2a2a2a;border-radius:99px;padding:8px 16px;font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;backdrop-filter:blur(8px);pointer-events:none;white-space:nowrap}
.dock .dots{display:flex;gap:3px}.dock .dots i{width:9px;height:9px;border-radius:50%}
.dock .go{background:var(--cy);color:#00161a;font-weight:700;padding:3px 9px;border-radius:99px}
@media (max-width:640px){.dock{display:none}}
.bk .cover{background:linear-gradient(125deg,#ff3b30,#b3150d 60%,#4a0805)!important}
.bk .base,.bk .pg i{background-image:repeating-linear-gradient(transparent 0 13px,rgba(255,59,48,.2) 13px 14px)!important}
/* editor-style intro */
.intro{position:fixed;inset:0;z-index:200;background:#000;overflow:hidden;animation:introOut .5s 2.7s forwards;cursor:pointer}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.intro .sel{position:absolute;border:1px solid var(--cy);opacity:0;animation:selIn 2.3s var(--d) both;background:linear-gradient(var(--cy),var(--cy)) 0 0/7px 7px no-repeat,linear-gradient(var(--cy),var(--cy)) 100% 0/7px 7px no-repeat,linear-gradient(var(--cy),var(--cy)) 0 100%/7px 7px no-repeat,linear-gradient(var(--cy),var(--cy)) 100% 100%/7px 7px no-repeat}
.intro .sel b{position:absolute;left:-1px;top:-20px;background:var(--cy);color:#00161a;font:700 .6rem "JetBrains Mono",monospace;padding:2px 6px;letter-spacing:.8px;white-space:nowrap}
@keyframes selIn{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.intro .cur{position:absolute;left:var(--x0);top:var(--y0);animation:curMove 2.3s var(--d) cubic-bezier(.5,0,.2,1) both;opacity:0}
.intro .cur svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
.intro .cur em{font-style:normal;display:block;margin:2px 0 0 14px;background:var(--c);color:#000;font:700 .6rem "JetBrains Mono",monospace;padding:2px 7px;border-radius:99px;width:max-content}
@keyframes curMove{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{left:var(--x1);top:var(--y1);opacity:0}}
.intro .big{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(3.4rem,17vw,9rem);color:transparent;-webkit-text-stroke:2px var(--accent);letter-spacing:3px;animation:bigIn 2.2s .5s both}
@keyframes bigIn{0%{opacity:0;transform:scale(1.1)}30%,80%{opacity:1;transform:none}100%{opacity:0}}
.intro .skip{position:absolute;right:16px;bottom:16px;font:700 .65rem "JetBrains Mono",monospace;color:#777;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){.intro{display:none}}

const SNA_EXPL = [
  "Multiple access protocols are rules that let many devices share the same communication channel.",
  "The notes list three main types: random access, controlled access and channelization.",
  "The three types are random access, controlled access and channelization. Switching is not one of them.",
  "When many devices send at the same time, data may collide. Multiple access protocols let devices share the channel in an organized way.",
  "Random access protocols let devices transmit when they need to, without permission from a central controller. All devices have equal opportunity to use the channel.",
  "If two or more devices transmit at the same time, a collision may occur.",
  "After a collision, devices usually wait for a random period and then try to send their data again.",
  "Four are listed: ALOHA, CSMA, CSMA/CD and CSMA/CA.",
  "Token passing is a controlled access protocol. ALOHA, CSMA, CSMA/CD and CSMA/CA are random access protocols.",
  "ALOHA is a simple random access protocol in which devices send data through a shared communication channel.",
  "If the receiver gets the data successfully, it sends an acknowledgement.",

const DIFF = {e:"Easy", m:"Medium", h:"Hard"};
const app = document.getElementById("app");

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function build(raw, ex){
  return raw.map((x,i)=>{
    const [d,t,q,c,...w] = x;
    const opts = shuffle([c,...w]);
    return {id:i, d, t, q, opts, a:opts.indexOf(c), e:(ex&&ex[i])||""};
  });
}

let state = null;

function showHome(){
  state = null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  app.innerHTML = "";
  const cnt = s => s.sections ? s.sections.reduce((n,x)=>n+x.questions.length,0) : s.questions.length;
  const tot = SUBJECTS.reduce((n,s)=>n+cnt(s),0);
  const hero = el("section","hero2");
  hero.innerHTML = '<div class="eyebrow">MCQ Practice Platform</div><h1>Exam preparation, <span>made simple.</span></h1><p class="lead">Practice <b>'+tot.toLocaleString()+' multiple-choice questions</b> across '+SUBJECTS.length+' subjects, with instant answers and clear explanations.</p><div class="hstats"><div><b>'+tot.toLocaleString()+'</b><span>Questions</span></div><div><b>'+SUBJECTS.length+'</b><span>Subjects</span></div><div><b>3</b><span>Difficulty levels</span></div></div>';
  app.appendChild(hero);
  app.appendChild(el("h2","sech","Subjects"));
  const grid = el("div","grid");
  SUBJECTS.forEach((s,i)=>{

    const b = el("button","subject"+(n?"":" empty"));
        b.appendChild(el("span","num","Subject "+id2));
    b.appendChild(el("h3",null,s.name));
    b.appendChild(el("p",null,n ? n+" questions \u00b7 Easy, Medium, Hard" : "No MCQs added yet"));
    b.onclick = ()=>openSubject(s.id);
    grid.appendChild(b);
  });
  app.appendChild(grid);
}

function secData(s,i){ return (s.sections && s.sections[i]) ? s.sections[i] : s; }

function openSubject(id){
  const s = SUBJECTS.find(x=>x.id===id);
  if(!s){showHome();return;}
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  state = {subject:s, section:0, qs:build(secData(s,0).questions, secData(s,0).explanations), diff:"all", topic:"all", answers:{}};
  render();
}

  const list = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  const holder = el("div");
  list.forEach((q,n)=>holder.appendChild(renderQ(q,n+1)));
  if(!list.length) holder.appendChild(el("div","panel emptybox","No questions match these filters."));
  app.appendChild(holder);
  app.appendChild(el("div","result hidden")).id = "final";
  updateStats(list);
}

function renderQ(q,n){
  const card = el("div","q");
  const meta = el("div","meta");
  meta.appendChild(el("span","tag "+({e:"easy",m:"medium",h:"hard"}[q.d]),DIFF[q.d]));
  meta.appendChild(el("span","tag topic",q.t));
  card.appendChild(meta);
  card.appendChild(el("p","qtext",n+". "+q.q));
  const letters = ["A","B","C","D"];
  const btns = [];
  q.opts.forEach((o,i)=>{
    const b = el("button","opt");
    b.appendChild(el("span","l",letters[i]+"."));
    b.appendChild(el("span",null,o));
    b.onclick = ()=>{
      if(state.answers[q.id]!==undefined) return;
      state.answers[q.id] = i;
      paint();
      updateStats();
    };
    btns.push(b); card.appendChild(b);
  });
  const note = el("div","note hidden");
  card.appendChild(note);
  const why = el("div","why hidden");
  card.appendChild(why);
  function paint(){
    const chosen = state.answers[q.id];
    if(chosen===undefined) return;
    card.classList.add("done");
    btns.forEach((b,i)=>{
      if(i===q.a) b.classList.add("ok");
      else if(i===chosen) b.classList.add("bad");
    });
    note.classList.remove("hidden","ok","bad");
    if(chosen===q.a){note.classList.add("ok");note.textContent="✓ Correct";}
    else{note.classList.add("bad");note.textContent="✗ Wrong. Correct answer: "+letters[q.a]+". "+q.opts[q.a];}
    if(q.e){why.classList.remove("hidden");why.textContent="💡 Reason: "+q.e;}
  }
  paint();
  return card;
}

function updateStats(list){
  const {qs,answers} = state;
  const shown = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  let ok=0,bad=0;
  shown.forEach(q=>{
    const a = answers[q.id];
    if(a===undefined) return;
    if(a===q.a) ok++; else bad++;
  });
  const done = ok+bad;
  document.getElementById("st-ans").textContent = done+" / "+shown.length;
  document.getElementById("st-ok").textContent = ok;
  document.getElementById("st-bad").textContent = bad;
  document.getElementById("st-pct").textContent = done ? Math.round(ok/done*100)+"%" : "-";
  document.getElementById("st-tot").textContent = shown.length;
  document.getElementById("st-bar").style.width = (shown.length ? done/shown.length*100 : 0)+"%";
  const fin = document.getElementById("final");
  if(fin){
    if(shown.length && done===shown.length){
      fin.classList.remove("hidden");
      fin.textContent = "🎉 Finished! You scored "+ok+" out of "+shown.length+" ("+Math.round(ok/shown.length*100)+"%).";
    } else fin.classList.add("hidden");
  }
}

/* ---------- BOOK LOADER (subject click) ---------- */
(function(){
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const wrap = document.getElementById("app");
  const ov = document.createElement("div"); ov.className = "bkload";
  let pages = ""; for(let i=0;i<7;i++) pages += '<div class="pg" style="--i:'+i+'"><i></i><i></i></div>';
  ov.innerHTML = '<div class="bk"><div class="cover"></div><div class="base bl"></div><div class="base br"></div>'+pages+'</div><div class="bktxt">Opening <span></span></div>';
  document.body.appendChild(ov);
  let busy = false, bypass = false;
  document.addEventListener("click", function(e){
    if(bypass) return;
    const t = e.target.closest(".subject");
    if(!t || !wrap.contains(t)) return;
    e.stopPropagation(); e.preventDefault();
    if(busy) return;
    busy = true;
    const h = t.querySelector("h3");
    ov.querySelector(".bktxt span").textContent = h ? h.textContent : "subject";
    ov.classList.add("on");
    setTimeout(function(){
      bypass = true; try{ t.click(); }catch(_){}
      bypass = false;
      window.scrollTo(0,0);
      ov.classList.remove("on");
      busy = false;
    }, reduce ? 0 : 1600);
  }, true);
})();

   Leave it empty and the counter stays hidden. */
const LIVE_URL = "https://mcq-class-default-rtdb.firebaseio.com";
(function(){
  if(!LIVE_URL) return;
  const base = LIVE_URL.replace(/\/$/,"");
  let id; try{ id = localStorage.getItem("uid"); if(!id){ id = Math.random().toString(36).slice(2,10); localStorage.setItem("uid",id); } }catch(e){ id = Math.random().toString(36).slice(2,10); }
  const pill = document.createElement("div"); pill.className = "live";
  pill.innerHTML = '<i></i><span></span>'; document.body.appendChild(pill);
  const label = pill.querySelector("span");
  async function beat(){
    try{
      const w = await fetch(base+"/presence/"+id+".json",{method:"PUT",body:'{".sv":"timestamp"}'});
      const nowSrv = await w.json();
      const r = await fetch(base+"/presence.json");
      const d = (await r.json()) || {};
      let n = 0;
      for(const k in d){
        const age = nowSrv - d[k];
        if(age < 45000) n++;
        else if(age > 300000) fetch(base+"/presence/"+k+".json",{method:"DELETE"}).catch(function(){});
      }
      n = Math.max(n,1);
      label.textContent = n===1 ? "1 online (you)" : n+" classmates online";
      pill.classList.add("on");
    }catch(e){ pill.classList.remove("on"); }
  }
  beat(); setInterval(beat,20000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) beat(); });
  addEventListener("pagehide",function(){ try{ fetch(base+"/presence/"+id+".json",{method:"DELETE",keepalive:true}); }catch(e){} });
})();
