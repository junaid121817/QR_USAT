<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ Practice</title>
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--text:#1d2030;--muted:#6b7089;--line:#e3e6f0;
  --accent:#4f46e5;--accent-soft:#eceafd;
  --ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;
  --easy:#15803d;--medium:#b45309;--hard:#b91c1c;
  --warn-bg:#fff4d6;--warn-text:#7a4b00;--warn-line:#f0d58a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141f;--card:#1c1f2e;--text:#eceefa;--muted:#9aa0bd;--line:#2d3150;
  --accent:#8b86ff;--accent-soft:#2a2850;--ok:#4ade80;--ok-bg:#12301f;--bad:#f87171;--bad-bg:#3a1618;
  --easy:#4ade80;--medium:#fbbf24;--hard:#f87171;
  --warn-bg:#3a2e12;--warn-text:#fbd98a;--warn-line:#5c4a1c;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.credit{background:#1e2340;color:#e6e8f5;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:11px 16px;font-size:.9rem;letter-spacing:.4px;border-bottom:3px solid var(--accent)}
.credit b{color:#fff;font-weight:700}
.credit i{width:1px;height:14px;background:#6b7089;display:inline-block}
@media (max-width:520px){.credit i{display:none}}
.notice{background:var(--warn-bg);color:var(--warn-text);border-bottom:1px solid var(--warn-line);padding:9px 16px;text-align:center;font-size:.88rem;line-height:1.45}
.notice b{font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.8rem;margin:10px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.subject{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.subject:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(79,70,229,.15)}
.subject .num{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:2px 10px;font-size:.8rem}
.subject h3{margin:12px 0 4px;font-size:1.1rem}
.subject p{margin:0;color:var(--muted);font-size:.9rem}
.subject.empty{opacity:.75}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px;font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.stat b{font-size:1.2rem}
.stat span{color:var(--muted);font-size:.85rem;display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:.3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,.btn,select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border-radius:10px}
.btn:hover,.chip:hover{border-color:var(--accent)}
select{border-radius:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:.78rem}
.tag{border-radius:99px;padding:2px 10px;font-weight:700;border:1px solid currentColor}
.tag.easy{color:var(--easy)}.tag.medium{color:var(--medium)}.tag.hard{color:var(--hard)}
.tag.topic{color:var(--muted);font-weight:600}
.qtext{font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{font-weight:700;color:var(--accent);min-width:18px}
.q.done .opt{cursor:default}
.q.done .opt:hover{border-color:var(--line)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{color:var(--bad)}
.note{margin-top:8px;font-size:.88rem;font-weight:600}
.note.ok{color:var(--ok)}.note.bad{color:var(--bad)}
.why{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.9rem}
.dlrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 4px}
.dlbtn{display:inline-block;font:inherit;font-weight:600;text-decoration:none;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:8px 16px;cursor:pointer}
.dlbtn:hover{filter:brightness(1.08)}
.dlbtn.off{background:var(--card);color:var(--muted);border-color:var(--line)}
.dlbtn.off:hover{filter:none;border-color:var(--accent)}
.dlmsg{color:var(--muted);font-size:.88rem}
.emptybox{text-align:center;padding:50px 20px;color:var(--muted)}
.result{text-align:center;font-size:1.1rem}
.hidden{display:none}

:root[data-theme="light"]{--bg:#f5f6fb;--card:#fff;--text:#1d2030;--muted:#6b7089;--line:#e3e6f0;--accent:#4f46e5;--accent-soft:#eceafd;--ok:#15803d;--ok-bg:#e7f7ec;--bad:#b91c1c;--bad-bg:#fdecec;--easy:#15803d;--medium:#b45309;--hard:#b91c1c;--warn-bg:#fff4d6;--warn-text:#7a4b00;--warn-line:#f0d58a}
:root[data-theme="dark"]{--bg:#000;--card:#0d0d12;--text:#eceefa;--muted:#9aa0bd;--line:#26283a;--accent:#8b86ff;--accent-soft:#1c1a3d;--ok:#4ade80;--ok-bg:#0c2416;--bad:#f87171;--bad-bg:#2a1012;--easy:#4ade80;--medium:#fbbf24;--hard:#f87171;--warn-bg:#2a2009;--warn-text:#fbd98a;--warn-line:#4a3a14}
.theme-btn{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:9px 16px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* ===== BOOK LOADER ===== */
.bkload{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(7px)}
.bkload.on{display:flex;animation:bkfade .25s}
@keyframes bkfade{from{opacity:0}to{opacity:1}}
.bk{position:relative;width:180px;height:124px;perspective:900px;transform:rotateX(14deg)}
.bk .cover{position:absolute;inset:-9px;border-radius:8px 14px 14px 8px;background:linear-gradient(125deg,#4f46e5,#7c3aed 60%,#ec4899);box-shadow:0 18px 34px rgba(0,0,0,.35)}
.bk .cover::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:rgba(0,0,0,.28)}
.bk .base{position:absolute;top:0;width:50%;height:100%;background-color:#fbf8ee;background-image:repeating-linear-gradient(transparent 0 13px,rgba(79,70,229,.18) 13px 14px);box-shadow:inset 0 0 14px rgba(0,0,0,.10)}
.bk .bl{left:0;border-radius:4px 0 0 4px}
.bk .br{right:0;border-radius:0 4px 4px 0}
.bk .pg{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;animation:bkflip .6s ease-in-out infinite;animation-delay:calc(var(--i) * -.1s)}
.bk .pg i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-color:#fffdf6;background-image:repeating-linear-gradient(transparent 0 13px,rgba(79,70,229,.16) 13px 14px);border-radius:0 4px 4px 0;box-shadow:0 0 8px rgba(0,0,0,.18)}
.bk .pg i+i{transform:rotateY(180deg);border-radius:4px 0 0 4px;background-color:#f3efe1}
@keyframes bkflip{0%{transform:rotateY(0deg)}100%{transform:rotateY(-180deg)}}
.bktxt{font-weight:700;font-size:1.05rem;color:var(--text);text-align:center;padding:0 20px;max-width:90vw}
.bktxt span{color:var(--accent)}
.bktxt::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:bkdots 1s steps(4) infinite;overflow:hidden;vertical-align:bottom}
@keyframes bkdots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* ===== LIVE CLASSMATES ===== */
.live{position:fixed;left:14px;bottom:14px;z-index:50;display:none;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 14px;font-size:.82rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.live.on{display:flex}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:livepulse 1.8s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>

const DIFF = {e:"Easy", m:"Medium", h:"Hard"};

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function build(raw, ex){
  return raw.map((x,i)=>{
    const [d,t,q,c,...w] = x;
    const opts = shuffle([c,...w]);
    return {id:i, d, t, q, opts, a:opts.indexOf(c), e:(ex&&ex[i])||""};
  });
}

let state = null;

function showHome(){
  state = null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  app.innerHTML = "";
  app.appendChild(el("h1",null,"MCQ Practice"));
  app.appendChild(el("p","sub","Choose a subject to start practicing."));
  const grid = el("div","grid");
  SUBJECTS.forEach((s,i)=>{
    const b = el("button","subject"+(s.questions.length?"":" empty"));
    b.appendChild(el("span","num","Subject "+(i+1)));
    b.appendChild(el("h3",null,s.name));
    b.appendChild(el("p",null,s.questions.length ? s.questions.length+" questions · Easy, Medium, Hard" : "No MCQs added yet"));
    b.onclick = ()=>openSubject(s.id);
    grid.appendChild(b);
  });
  app.appendChild(grid);
}

function secData(s,i){ return (s.sections && s.sections[i]) ? s.sections[i] : s; }

function openSubject(id){
  const s = SUBJECTS.find(x=>x.id===id);
  if(!s){showHome();return;}
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  state = {subject:s, section:0, qs:build(secData(s,0).questions, secData(s,0).explanations), diff:"all", topic:"all", answers:{}};
  render();
}

function render(){
  const {subject, qs} = state;
  app.innerHTML = "";
  const back = el("button","back","← All subjects");
  back.onclick = showHome;
  app.appendChild(back);
  app.appendChild(el("h1",null,subject.name));

  /* download button (same place for every subject) */
  const dl = el("div","dlrow");
  if(subject.files && subject.files.length){
    subject.files.forEach(f=>{
      const a = el("a","dlbtn","⬇ "+f[0]);
      a.href = f[1];
      a.setAttribute("download","");
      a.target = "_blank"; a.rel = "noopener";
      dl.appendChild(a);
    });
  } else if(subject.pdf){
    const a = el("a","dlbtn","⬇ Download Notes");
    a.href = subject.pdf;
    a.setAttribute("download","");
    a.target = "_blank"; a.rel = "noopener";
    dl.appendChild(a);
  } else {
    const b = el("button","dlbtn off","⬇ Download Notes");
    const msg = el("span","dlmsg");
    b.onclick = ()=>{ msg.textContent = "Notes for this subject will be added soon."; };
    dl.appendChild(b); dl.appendChild(msg);
  }
  app.appendChild(dl);

  if(subject.sections && subject.sections.length){
    const sp = el("div","panel controls");
    sp.appendChild(el("b",null,"Section:"));
    subject.sections.forEach((sc,i)=>{
      const c = el("button","chip"+((state.section||0)===i?" on":""),sc.name+" ("+sc.questions.length+")");
      c.onclick = ()=>{ state.section=i; state.qs=build(sc.questions, sc.explanations); state.answers={}; state.diff="all"; state.topic="all"; render(); window.scrollTo(0,0); };
      sp.appendChild(c);
    });
    app.appendChild(sp);
  }

  if(!qs.length){
    const box = el("div","panel emptybox");
    box.appendChild(el("h3",null,"No MCQs added yet"));
    box.appendChild(el("p",null,"MCQs for this subject will appear here once they are added."));
    app.appendChild(box);
    return;
  }

  /* stats panel */
  const stats = el("div","panel");
  const row = el("div","stats");
  const mk = (id,label)=>{const d=el("div","stat");const b=el("b",null,"0");b.id=id;d.appendChild(b);d.appendChild(el("span",null,label));return d;};
  row.appendChild(mk("st-ans","Answered"));
  row.appendChild(mk("st-ok","Correct"));
  row.appendChild(mk("st-bad","Wrong"));
  row.appendChild(mk("st-pct","Score"));
  row.appendChild(mk("st-tot","Questions shown"));
  stats.appendChild(row);
  const bar = el("div","bar"); const fill = document.createElement("i"); fill.id="st-bar"; bar.appendChild(fill);
  stats.appendChild(bar);
  app.appendChild(stats);

  /* controls */
  const ctl = el("div","panel controls");
  const counts = {all:qs.length,e:0,m:0,h:0};
  qs.forEach(q=>counts[q.d]++);
  [["all","All"],["e","Easy"],["m","Medium"],["h","Hard"]].forEach(([k,label])=>{
    const c = el("button","chip"+(state.diff===k?" on":""),label+" ("+counts[k]+")");
    c.onclick = ()=>{state.diff=k;render();};
    ctl.appendChild(c);
  });
  const sel = document.createElement("select");
  const topics = ["all"].concat([...new Set(qs.map(q=>q.t))]);
  topics.forEach(t=>{
    const o = el("option",null,t==="all"?"All topics":t); o.value=t; if(state.topic===t) o.selected=true; sel.appendChild(o);
  });
  sel.onchange = ()=>{state.topic=sel.value;render();};
  ctl.appendChild(sel);
  const sh = el("button","btn","🔀 Shuffle");
  sh.onclick = ()=>{state.qs = shuffle(state.qs);render();};
  ctl.appendChild(sh);
  const rs = el("button","btn","↺ Restart");
  rs.onclick = ()=>{{const sd=secData(subject,state.section||0); state.qs = build(sd.questions, sd.explanations);} state.answers={}; render(); window.scrollTo(0,0);};
  ctl.appendChild(rs);
  app.appendChild(ctl);

  /* questions */
  const list = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  const holder = el("div");
  list.forEach((q,n)=>holder.appendChild(renderQ(q,n+1)));
  if(!list.length) holder.appendChild(el("div","panel emptybox","No questions match these filters."));
  app.appendChild(holder);
  app.appendChild(el("div","result hidden")).id = "final";
  updateStats(list);
}

function renderQ(q,n){
  const card = el("div","q");
  const meta = el("div","meta");
  meta.appendChild(el("span","tag "+({e:"easy",m:"medium",h:"hard"}[q.d]),DIFF[q.d]));
  meta.appendChild(el("span","tag topic",q.t));
  card.appendChild(meta);
  card.appendChild(el("p","qtext",n+". "+q.q));
  const letters = ["A","B","C","D"];
  const btns = [];
  q.opts.forEach((o,i)=>{
    const b = el("button","opt");
    b.appendChild(el("span","l",letters[i]+"."));
    b.appendChild(el("span",null,o));
    b.onclick = ()=>{
      if(state.answers[q.id]!==undefined) return;
      state.answers[q.id] = i;
      paint();
      updateStats();
    };
    btns.push(b); card.appendChild(b);
  });
  const note = el("div","note hidden");
  card.appendChild(note);
  const why = el("div","why hidden");
  card.appendChild(why);
  function paint(){
    const chosen = state.answers[q.id];
    if(chosen===undefined) return;
    card.classList.add("done");
    btns.forEach((b,i)=>{
      if(i===q.a) b.classList.add("ok");
      else if(i===chosen) b.classList.add("bad");
    });
    note.classList.remove("hidden","ok","bad");
    if(chosen===q.a){note.classList.add("ok");note.textContent="✓ Correct";}
    else{note.classList.add("bad");note.textContent="✗ Wrong. Correct answer: "+letters[q.a]+". "+q.opts[q.a];}
    if(q.e){why.classList.remove("hidden");why.textContent="💡 Reason: "+q.e;}
  }
  paint();
  return card;
}

function updateStats(list){
  const {qs,answers} = state;
  const shown = qs.filter(q=>(state.diff==="all"||q.d===state.diff)&&(state.topic==="all"||q.t===state.topic));
  let ok=0,bad=0;
  shown.forEach(q=>{
    const a = answers[q.id];
    if(a===undefined) return;
    if(a===q.a) ok++; else bad++;
  });
  const done = ok+bad;
  document.getElementById("st-ans").textContent = done+" / "+shown.length;
  document.getElementById("st-ok").textContent = ok;
  document.getElementById("st-bad").textContent = bad;
  document.getElementById("st-pct").textContent = done ? Math.round(ok/done*100)+"%" : "-";
  document.getElementById("st-tot").textContent = shown.length;
  document.getElementById("st-bar").style.width = (shown.length ? done/shown.length*100 : 0)+"%";
  const fin = document.getElementById("final");
  if(fin){
    if(shown.length && done===shown.length){
      fin.classList.remove("hidden");
      fin.textContent = "🎉 Finished! You scored "+ok+" out of "+shown.length+" ("+Math.round(ok/shown.length*100)+"%).";
    } else fin.classList.add("hidden");
  }
}
